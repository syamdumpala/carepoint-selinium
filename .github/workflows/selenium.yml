name: CarePoint Selenium

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run ${{ matrix.browser }} suite
        run: >
          pytest --browser ${{ matrix.browser }} --headless
          --html=reports/${{ matrix.browser }}.html
          --self-contained-html
          --junitxml=reports/${{ matrix.browser }}.xml
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carepoint-${{ matrix.browser }}-reports
          path: |
            reports/
            artifacts/
